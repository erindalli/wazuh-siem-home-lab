<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wazuh SIEM home lab network topology</title>
<desc>Kali attacker VM targets both the Victim VM (DVWA) and the Honeypot VM (Cowrie); both send agent logs to the Wazuh Manager VM, which an analyst views via browser.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
</marker>
</defs>

<rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

<text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">Wazuh SIEM Home Lab — Network Topology</text>
<text x="450" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">All hosts on 192.168.64.0/24 (UTM shared network)</text>

<!-- Kali node -->
<rect x="360" y="90" width="180" height="76" rx="10" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<text x="450" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Kali Linux</text>
<text x="450" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Attacker host</text>
<text x="450" y="152" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">192.168.64.7</text>

<!-- Victim node -->
<rect x="90" y="290" width="200" height="84" rx="10" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<text x="190" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Victim</text>
<text x="190" y="334" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">DVWA target (Apache/MariaDB)</text>
<text x="190" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">192.168.64.12</text>
<text x="190" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">Wazuh agent installed</text>

<!-- Honeypot node -->
<rect x="610" y="290" width="200" height="84" rx="10" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<text x="710" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Honeypot</text>
<text x="710" y="334" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Cowrie SSH deception host</text>
<text x="710" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">192.168.64.14</text>
<text x="710" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">Wazuh agent installed</text>

<!-- Wazuh Manager node -->
<rect x="330" y="460" width="240" height="90" rx="10" fill="#e8e8e8" stroke="#666" stroke-width="2"/>
<text x="450" y="487" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Wazuh Manager</text>
<text x="450" y="505" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Indexer + Manager + Dashboard</text>
<text x="450" y="523" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">192.168.64.10</text>
<text x="450" y="540" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">SIEM core — analyst views alerts here</text>

<!-- Arrows: Kali -> Victim -->
<line x1="400" y1="166" x2="230" y2="288" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Brute force + SQLi</text>
<text x="270" y="234" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">HTTP :80</text>

<!-- Arrows: Kali -> Honeypot -->
<line x1="500" y1="166" x2="670" y2="288" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="630" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">SSH login attempts</text>
<text x="630" y="234" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">:22 → Cowrie :2224</text>

<!-- Arrows: Victim -> Manager -->
<line x1="220" y1="374" x2="380" y2="462" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="255" y="425" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a7fb5">Agent logs</text>
<text x="255" y="439" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">:1514</text>

<!-- Arrows: Honeypot -> Manager -->
<line x1="680" y1="374" x2="520" y2="462" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="645" y="425" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a7fb5">Agent logs</text>
<text x="645" y="439" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">:1514</text>

<!-- Analyst -->
<rect x="380" y="580" width="140" height="34" rx="8" fill="none" stroke="#bbb" stroke-width="1.25" stroke-dasharray="3,3"/>
<text x="450" y="601" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Analyst — browser :443</text>
<line x1="450" y1="550" x2="450" y2="580" stroke="#999" stroke-width="1.25" marker-end="url(#arrow)"/>

</svg>
